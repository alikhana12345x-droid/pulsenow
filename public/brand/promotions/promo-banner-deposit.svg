<svg width="600" height="96" viewBox="0 0 600 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070510"/><stop offset="40%" stop-color="#090714"/><stop offset="100%" stop-color="#0d0b1e"/>
    </linearGradient>
    <radialGradient id="amberbleed" cx="74%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#f29a0b" stop-opacity="0.42"/>
      <stop offset="40%" stop-color="#c2780a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090714" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chipFace" cx="36%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#fff6dd"/><stop offset="18%" stop-color="#ffe08f"/>
      <stop offset="46%" stop-color="#fdc24a"/><stop offset="72%" stop-color="#f29a0b"/><stop offset="100%" stop-color="#945206"/>
    </radialGradient>
    <radialGradient id="chipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd36b" stop-opacity="0.9"/><stop offset="55%" stop-color="#f29a0b" stop-opacity="0.32"/><stop offset="100%" stop-color="#f29a0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlyph" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/><stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="ghost"><feGaussianBlur stdDeviation="3.2"/></filter>
    <clipPath id="frame"><rect width="600" height="96" rx="12"/></clipPath>
    <!-- detailed casino chip: matte ring + amber edge + hatching + center -->
    <g id="chip">
      <circle r="40" fill="#f29a0b"/>
      <circle r="40" fill="url(#chipFace)"/>
      <!-- fine hatching on outer ring -->
      <g stroke="#7a4a05" stroke-width="0.9" opacity="0.55">
        <line x1="0" y1="-40" x2="0" y2="-32"/><line x1="14" y1="-37" x2="11" y2="-30"/>
        <line x1="27" y1="-29" x2="22" y2="-24"/><line x1="36" y1="-17" x2="29" y2="-14"/>
        <line x1="40" y1="0" x2="32" y2="0"/><line x1="36" y1="17" x2="29" y2="14"/>
        <line x1="27" y1="29" x2="22" y2="24"/><line x1="14" y1="37" x2="11" y2="30"/>
        <line x1="0" y1="40" x2="0" y2="32"/><line x1="-14" y1="37" x2="-11" y2="30"/>
        <line x1="-27" y1="29" x2="-22" y2="24"/><line x1="-36" y1="17" x2="-29" y2="14"/>
        <line x1="-40" y1="0" x2="-32" y2="0"/><line x1="-36" y1="-17" x2="-29" y2="-14"/>
        <line x1="-27" y1="-29" x2="-22" y2="-24"/><line x1="-14" y1="-37" x2="-11" y2="-30"/>
      </g>
      <circle r="40" fill="none" stroke="#5c3604" stroke-width="1.6"/>
      <!-- alternating edge dash blocks (amber/dark) -->
      <g fill="#1a1208">
        <path d="M0,-40 A40,40 0 0,1 20,-34.6 L16,-27.7 A32,32 0 0,0 0,-32 Z"/>
        <path d="M34.6,-20 A40,40 0 0,1 40,0 L32,0 A32,32 0 0,0 27.7,-16 Z"/>
        <path d="M20,34.6 A40,40 0 0,1 0,40 L0,32 A32,32 0 0,0 16,27.7 Z"/>
        <path d="M-34.6,20 A40,40 0 0,1 -40,0 L-32,0 A32,32 0 0,0 -27.7,16 Z"/>
      </g>
      <!-- matte-black center ring -->
      <circle r="26" fill="#100c1c"/>
      <circle r="26" fill="none" stroke="#f29a0b" stroke-width="1.4" opacity="0.85"/>
      <circle r="20" fill="none" stroke="#3a2410" stroke-width="1"/>
      <!-- center emblem sparkle in amber -->
      <path d="M0,-13 L3.4,-3.4 L13,0 L3.4,3.4 L0,13 L-3.4,3.4 L-13,0 L-3.4,-3.4 Z" fill="#f29a0b" opacity="0.9"/>
      <circle r="3" fill="#ffe08f"/>
      <!-- specular -->
      <ellipse cx="-14" cy="-15" rx="11" ry="7" fill="#fffaf0" opacity="0.55" filter="url(#soft)"/>
      <circle cx="-18" cy="-18" r="2.6" fill="#ffffff"/>
    </g>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="96" fill="url(#bg)"/>
    <rect width="600" height="96" fill="url(#amberbleed)"/>
    <!-- subliminal teal x2 glyph (texture, not readable) -->
    <g filter="url(#softer)" opacity="0.9">
      <circle cx="430" cy="42" r="34" fill="url(#tealGlyph)"/>
    </g>
    <g fill="none" stroke="#5eead4" stroke-width="3" opacity="0.16" filter="url(#soft)">
      <path d="M412,30 L430,48 M430,30 L412,48"/>
      <path d="M442,28 Q452,28 452,36 Q452,42 444,48 L453,48"/>
    </g>
    <!-- ghost chips behind at depth -->
    <g filter="url(#ghost)" opacity="0.5"><g transform="translate(470,56) rotate(-10) scale(0.8)"><use href="#chip"/></g></g>
    <g filter="url(#ghost)" opacity="0.42"><g transform="translate(560,34) rotate(14) scale(0.7)"><use href="#chip"/></g></g>
    <!-- hero chip, 15 deg tilt, glow -->
    <g transform="translate(515,48)">
      <ellipse cx="0" cy="2" rx="52" ry="50" fill="url(#chipGlow)"/>
      <g transform="rotate(-15) scale(1,0.94)"><use href="#chip"/></g>
    </g>
    <!-- amber anamorphic laser line at 1/3 height (y=32), full width -->
    <g>
      <rect x="0" y="31.4" width="600" height="1.1" fill="#f29a0b" opacity="0.5"/>
      <rect x="80" y="30.6" width="440" height="2.4" fill="#f29a0b" opacity="0.32" filter="url(#soft)"/>
      <circle cx="300" cy="32" r="2.6" fill="#ffe08f" filter="url(#soft)"/>
    </g>
    <linearGradient id="leftmask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#060410" stop-opacity="0.95"/><stop offset="60%" stop-color="#070510" stop-opacity="0.3"/><stop offset="100%" stop-color="#070510" stop-opacity="0"/>
    </linearGradient>
    <rect x="0" y="0" width="285" height="96" fill="url(#leftmask)"/>
  </g>
</svg>
