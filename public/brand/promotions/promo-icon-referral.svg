<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#3a2410" stop-opacity="0.75"/><stop offset="60%" stop-color="#16101f" stop-opacity="0.3"/><stop offset="100%" stop-color="#0d0b1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc24a"/><stop offset="100%" stop-color="#e08906"/>
    </linearGradient>
    <linearGradient id="amber2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdc24a"/><stop offset="100%" stop-color="#f29a0b"/>
    </linearGradient>
    <filter id="edgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#f29a0b" flood-opacity="0.8"/>
    </filter>
    <filter id="tealGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#5eead4" flood-opacity="0.95"/>
    </filter>
    <clipPath id="sq"><rect width="200" height="200" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="200" height="200" fill="#0d0b1e"/>
    <rect width="200" height="200" fill="url(#bgGlow)"/>
    <!-- back silhouette (smaller, behind, left) -->
    <g filter="url(#edgeGlow)" opacity="0.85">
      <circle cx="68" cy="74" r="22" fill="url(#amber)"/>
      <path d="M34,138 Q34,102 68,102 Q102,102 102,138 L102,150 L34,150 Z" fill="url(#amber)"/>
    </g>
    <!-- front silhouette (larger, foreground, right) -->
    <g filter="url(#edgeGlow)">
      <circle cx="130" cy="80" r="27" fill="url(#amber2)"/>
      <path d="M86,156 Q86,114 130,114 Q174,114 174,156 L174,168 L86,168 Z" fill="url(#amber2)"/>
    </g>
    <!-- separation stroke so they read as two -->
    <g fill="none" stroke="#0d0b1e" stroke-width="3" opacity="0.55">
      <circle cx="130" cy="80" r="28.5"/>
      <path d="M86,156 Q86,113 130,113 Q174,113 174,156"/>
    </g>
    <!-- teal link-chain between them -->
    <g filter="url(#tealGlow)" stroke="#5eead4" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M92,52 a10,10 0 1,0 14,14"/>
      <path d="M112,72 a10,10 0 1,0 -14,-14"/>
    </g>
    <circle cx="100" cy="58" r="3.5" fill="#aef7ec" filter="url(#tealGlow)"/>
  </g>
</svg>
