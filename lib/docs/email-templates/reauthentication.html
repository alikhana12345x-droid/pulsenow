<!-- Supabase → Authentication → Emails → Templates → "Reauthentication"
     Subject: Your PulseNow confirmation code
     OPTIONAL — only sent when "Secure password change" is enabled
     (Authentication → Providers → Email). Always a code, never a link. -->
<div style="background:#090714;padding:40px 20px;font-family:Arial,Helvetica,sans-serif">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:480px;margin:0 auto;background:#0f0d21;border:1px solid rgba(255,255,255,0.08);border-radius:16px">
    <tr>
      <td style="background:linear-gradient(135deg,rgba(242,154,11,0.15),transparent);padding:32px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.06);border-radius:16px 16px 0 0">
        <h1 style="color:#f29a0b;font-size:28px;font-weight:900;margin:0;letter-spacing:-0.5px">PulseNow</h1>
        <p style="color:rgba(255,255,255,0.4);font-size:12px;margin:6px 0 0;letter-spacing:0.2em;text-transform:uppercase">Confirm it&rsquo;s you</p>
      </td>
    </tr>
    <tr>
      <td style="padding:32px">
        <p style="color:rgba(255,255,255,0.8);font-size:15px;line-height:1.6;margin:0 0 24px">
          Enter this code in the app to confirm the change to your PulseNow account.
        </p>
        <div style="text-align:center;margin:32px 0">
          <span style="display:inline-block;background:rgba(242,154,11,0.12);border:1px solid rgba(242,154,11,0.35);color:#f29a0b;font-weight:900;font-size:32px;letter-spacing:0.35em;padding:16px 20px 16px 32px;border-radius:12px;font-family:'Courier New',Courier,monospace">{{ .Token }}</span>
        </div>
        <p style="color:rgba(255,255,255,0.3);font-size:12px;text-align:center;line-height:1.6;margin:0">
          This code expires in 1 hour. If you didn&rsquo;t start this, someone may have your password &mdash; reset it right away.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px;border-top:1px solid rgba(255,255,255,0.06);text-align:center">
        <p style="color:rgba(255,255,255,0.2);font-size:11px;margin:0">&copy; 2026 PulseNow. All rights reserved.</p>
      </td>
    </tr>
  </table>
</div>
