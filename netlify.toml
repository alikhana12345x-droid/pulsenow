# Netlify deploy. Netlify detects Next.js and applies its OpenNext adapter
# (@netlify/plugin-nextjs) automatically — pages and route handlers become
# Netlify Functions, proxy.ts runs as an Edge Function, next/image uses the
# Netlify Image CDN. No standalone build: BUILD_STANDALONE stays unset.
#
# Secrets (DB_URL, SUPABASE_SERVICE_ROLE_KEY, SOLID_PAY_*) go in the Netlify UI,
# never here — see infra/NETLIFY.md. NEXT_PUBLIC_* are compiled into the client
# bundle at build time, so they must be set before the build runs.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Not secrets, but they show up in the build output and repo, so Netlify's
  # secrets scanner fails the build on them. NEXT_PUBLIC_* are in the client
  # bundle by design. The SolidPay ones are a URL, SolidPay's published callback
  # IP, and a merchant number that collides with the brand name in page titles —
  # the real credentials (SOLID_PAY_API_KEY, SOLID_PAY_PROXY_SECRET) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SANDBOX_MODE,SOLID_PAY_BASE_URL,SOLID_PAY_CALLBACK_IPS,SOLID_PAY_MERCHANT_NO"
